    <style>
      #app-splash {
        position: fixed;
        inset: 0;
        z-index: 99999;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        background: #f1f5f9;
        transition: opacity 0.35s ease;
      }
      #app-splash.is-hidden {
        opacity: 0;
        pointer-events: none;
      }
      #app-splash img {
        width: 88px;
        height: 88px;
        object-fit: contain;
        border-radius: 20px;
        box-shadow: 0 10px 40px rgba(37, 99, 235, 0.12);
      }
      #app-splash p {
        margin: 1rem 0 0;
        font-family: Cairo, Tajawal, sans-serif;
        font-size: 13px;
        font-weight: 700;
        color: #64748b;
      }
    </style>
  </head>
  <body>
    <div id="app-splash" aria-hidden="true">
      <img src="/brand/logo-256.webp?v=3" alt="" width="88" height="88" />
      <p>Win Gold</p>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
    <script>
      window.addEventListener('DOMContentLoaded', function () {
        var splash = document.getElementById('app-splash');
        if (!splash) return;
        var hide = function () {
          splash.classList.add('is-hidden');
          window.setTimeout(function () { splash.remove(); }, 400);
        };
        window.addEventListener('load', function () { window.setTimeout(hide, 300); });
        window.setTimeout(hide, 4000);
      });
    </script>
  </body>
</html>
